<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Moussa Business — Hors ligne</title>
<link rel="icon" href="images/logo/logo-mb.png"/>
<style>
:root{--bg:#0A0A0E;--surf:#16161E;--acc:#FF5A36;--text:#F0F0F5;--t2:#A0A0B8;--t3:#5A5A78;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:"Barlow",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.wrap{text-align:center;max-width:340px;}
.logo{width:72px;height:72px;border-radius:18px;background:var(--surf);border:2px solid rgba(255,90,54,.2);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;overflow:hidden;padding:6px;}
.logo img{width:100%;height:100%;object-fit:contain;}
h1{font-size:26px;font-weight:900;text-transform:uppercase;letter-spacing:1px;margin-bottom:10px;}
h1 span{color:var(--acc);}
p{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:28px;}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--acc);color:#fff;padding:14px 24px;border-radius:12px;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;border:none;cursor:pointer;text-decoration:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><img src="images/logo/logo-mb.png" alt="Moussa Business"/></div>
  <h1>Moussa <span>Business</span></h1>
  <p>Vous êtes hors ligne. Vérifiez votre connexion internet et réessayez.</p>
  <a class="btn" href="/">↺ Réessayer</a>
</div>
</body>
</html>
